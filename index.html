const FX=(()=>{
  let reduce=false; try{ reduce=matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
  const cv=document.getElementById('fx'); const ctx=cv.getContext('2d');
  let parts=[], raf=0, dpr=1;
  function size(){ dpr=Math.min(2,window.devicePixelRatio||1); cv.width=innerWidth*dpr; cv.height=innerHeight*dpr; }
  size(); addEventListener('resize',size);
  const COLORS=['#1b6a80','#2a9d8f','#e9c46a','#f4a261','#e76f51','#5b8def','#8ac926'];
  function piece(x,y,vx,vy,i){ return {x,y,vx,vy,g:.2,w:6+Math.random()*6,h:3+Math.random()*4,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:COLORS[i%COLORS.length],life:100+Math.random()*50,round:Math.random()<.25}; }
  function burst(x,y,n,power){ if(reduce) return; n=n||36; power=power||1; for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, v=(2+Math.random()*5)*power; parts.push(piece(x,y,Math.cos(a)*v,Math.sin(a)*v-3*power,i)); } run(); }
  function cannon(){ if(reduce) return; const W=innerWidth,H=innerHeight; for(let i=0;i<140;i++){ const left=i%2===0; const a=(left?-Math.PI/3:-2*Math.PI/3)+(Math.random()-.5)*.55; const v=11+Math.random()*9; parts.push(piece(left?0:W,H,Math.cos(a)*v,Math.sin(a)*v,i)); } run(); }
  function run(){ if(!raf) raf=requestAnimationFrame(step); }
  function step(){
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,innerWidth,innerHeight);
    parts=parts.filter(p=>p.life>0&&p.y<innerHeight+60);
    for(const p of parts){ p.vy+=p.g; p.vx*=.985; p.vy*=.99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.life--; ctx.save(); ctx.globalAlpha=Math.min(1,p.life/30); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; if(p.round){ ctx.beginPath(); ctx.arc(0,0,p.w/2.6,0,Math.PI*2); ctx.fill(); } else ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore(); }
    raf=parts.length?requestAnimationFrame(step):0;
  }
  return {burst,cannon,get reduce(){ return reduce; }};
})();
function confettiAt(el,n){
  if(el&&el.isConnected){ const r=el.getBoundingClientRect(); FX.burst(r.left+Math.min(r.width/2,160),r.top+r.height/2,n); }
  else FX.burst(innerWidth/2,innerHeight/2,n);
}

function startQuiz(cfg){
  cleanup(); setNav('quiz'); window.scrollTo(0,0);
  const st={i:0,res:[],t0:Date.now(),lives:cfg.lives||0,streak:0,best:0,picked:-1,revealed:false,q:null};
  let queue=cfg.ids.slice(); const seen={}; let auto=0;
  const wrap=h('section',{class:'quiz'}); mount(wrap);
  const timerEl=h('span',{class:'qstat'});
  const tick=()=>{ timerEl.textContent=fmtTime(Date.now()-st.t0); };
  const iv=setInterval(tick,1000);
  onCleanup(()=>{ clearInterval(iv); clearTimeout(auto); });
  keyHandler=e=>{
    const k=e.key.toLowerCase();
    let i='1234'.indexOf(k); if(i<0&&k.length===1) i='abcd'.indexOf(k);
    if(i>=0&&k.length===1){ e.preventDefault(); choose(i); return; }
    if((k==='enter'||k==='arrowright')&&!(e.target instanceof HTMLButtonElement)){ e.preventDefault(); next(); return; }
    if(k==='s') reshuffle();
  };
  load();

  function load(){
    if(cfg.mode==='survival'&&st.i>=queue.length) queue=queue.concat(shuffle(cfg.pool));
    if(st.i>=queue.length) return finish();
    st.q=buildQ(queue[st.i],cfg.shuffle); st.picked=-1; st.revealed=false;
    draw(true);
  }
  function commit(i){
    const q=st.q, ok=q.choices[i].ok;
    st.picked=i; st.revealed=true;
    record(q.id,q.t,ok);
    st.res.push({q,picked:i,ok});
    if(ok){ st.streak++; st.best=Math.max(st.best,st.streak); noteStreak(st.streak); } else { st.streak=0; if(cfg.lives) st.lives--; }
    if(cfg.mode==='mistakes'){ seen[q.id]=(seen[q.id]||0)+1; if((q.id in S.mistakes)&&seen[q.id]<3) queue.splice(Math.min(queue.length,st.i+4),0,q.id); }
    return ok;
  }
  function choose(i){
    if(st.revealed||!st.q.choices[i]) return;
    if(!cfg.feedback){ st.picked=i; draw(); return; }
    const ok=commit(i);
    draw();
    if(ok){ confettiAt(wrap.querySelector('.choice.right'),st.streak>=5?60:40); if(cfg.mode==='survival') auto=setTimeout(next,1200); }
  }
  function next(){
    clearTimeout(auto);
    if(!cfg.feedback){ if(st.picked<0) return; commit(st.picked); }
    else if(!st.revealed) return;
    if(cfg.lives&&st.lives<=0) return finish();
    st.i++; load();
  }
  function reshuffle(){ if(st.revealed) return; st.q.choices=shuffle(st.q.choices); st.picked=-1; draw(); }
  function finish(){ showResults(cfg,st); }
  function draw(isNew){
    const q=st.q, n=st.i+1, survival=cfg.mode==='survival', total=queue.length;
    const right=st.res.filter(r=>r.ok).length;
    const revealed=st.revealed&&cfg.feedback;
    const head=h('div',{class:'quiz-head'},
      h('div',{class:'quiz-top'},
        h('div',{class:'eyebrow'},cfg.title),
        h('div',{class:'qstats'},
          survival?h('span',{class:'lives',role:'img','aria-label':st.lives+' of 3 lives left'},[0,1,2].map(i=>h('span',{class:'life'+(i<st.lives?' on':'')}))):null,
          survival?h('span',{class:'qstat'},'Score ',h('b',{},String(right))):h('span',{class:'qstat'},'Question ',h('b',{},n+' of '+total)),
          cfg.feedback&&!survival?h('span',{class:'qstat'},h('b',{},String(right)),' correct'):null,

/* =========================================================
   SORT IT
   ========================================================= */
function viewSort(){
  setNav('sort');
  let set=SORTS.find(s=>s.id===S.settings.sort)||SORTS[0], g=null;
  const wrap=h('section',{class:'game'}); mount(wrap);
  function load(s){ set=s; S.settings.sort=s.id; save(); g={tray:shuffle(s.items.map(([text,b],i)=>({id:i,text,b,missed:false}))),placed:Object.fromEntries(s.buckets.map(b=>[b[0],[]])),sel:null,misses:0,shake:null,done:false}; draw(); }
  function place(id,bk){
    const it=g.tray.find(x=>x.id===id); if(!it) return;
    if(it.b===bk){
      g.tray=g.tray.filter(x=>x!==it); g.placed[bk].push(it); g.sel=null; draw();
      if(!g.tray.length){ g.done=true; draw(); setTimeout(()=>{ if(g.misses===0) FX.cannon(); else confettiAt(wrap.querySelector('.result-banner'),60); },120); }
    } else {
      it.missed=true; g.misses++; g.sel=null; g.shake={id,bk}; draw();
      const gg=g; setTimeout(()=>{ if(g===gg) g.shake=null; },450);
    }
  }
  function draw(){
    const total=set.items.length, idx=SORTS.indexOf(set);
    const selItem=g.sel!=null?g.tray.find(x=>x.id===g.sel):null;
    const firstTry=total-new Set(Object.values(g.placed).flat().filter(x=>x.missed).map(x=>x.id)).size;
    keepFocus(()=>wrap.replaceChildren(
      h('div',{class:'game-head'},h('div',{},h('div',{class:'eyebrow'},'Sort It · board '+(idx+1)+' of '+SORTS.length),h('h2',{class:'game-title'},set.name),h('p',{class:'muted'},set.desc)),
        h('div',{class:'qstats'},h('span',{class:'qstat'},'Sorted ',h('b',{},(total-g.tray.length)+'/'+total)),h('span',{class:'qstat'},'Misses ',h('b',{},String(g.misses))))),
      h('div',{class:'chips'},SORTS.map(s=>chip(s.name,s===set,()=>load(s),'sb-'+s.id))),
      g.done?h('div',{class:'panel result-banner'},h('div',{},h('b',{},g.misses?'Board complete':'Perfect sort'),h('p',{class:'muted'},firstTry+' of '+total+' right on the first try')),
        h('div',{class:'row'},h('button',{class:'btn primary',type:'button','data-key':'snext',onclick:()=>load(SORTS[(idx+1)%SORTS.length])},'Next board'),h('button',{class:'btn',type:'button','data-key':'sagain',onclick:()=>load(set)},'Replay'))):null,
      g.done?null:h('div',{class:'select-hint',role:'status'},selItem?'Now click the group for: '+selItem.text:'Click an item, then click its group. You can also drag items.'),
      g.done?null:h('div',{class:'tray'},g.tray.map(it=>h('button',{class:'item'+(g.sel===it.id?' sel':'')+(it.missed?' missed':'')+(g.shake&&g.shake.id===it.id?' shake':''),type:'button',draggable:'true','data-key':'it-'+it.id,
        ondragstart:e=>{ try{ e.dataTransfer.setData('text/plain',String(it.id)); e.dataTransfer.effectAllowed='move'; }catch(_){} g.sel=it.id; },
        onclick:()=>{ g.sel=g.sel===it.id?null:it.id; draw(); }},it.text))),
      h('div',{class:'buckets'},set.buckets.map(([bk,name])=>h('button',{class:'bucket'+(selItem?' armed':'')+(g.shake&&g.shake.bk===bk?' shake':''),type:'button','data-bucket':bk,'data-key':'bk-'+bk,
        onclick:()=>{ if(g.sel!=null) place(g.sel,bk); },
        ondragover:e=>{ e.preventDefault(); e.currentTarget.classList.add('over'); },
        ondragleave:e=>{ e.currentTarget.classList.remove('over'); },
        ondrop:e=>{ e.preventDefault(); e.currentTarget.classList.remove('over'); let id=g.sel; try{ const d=e.dataTransfer.getData('text/plain'); if(d!=='') id=+d; }catch(_){} if(id!=null) place(id,bk); }},
        h('h4',{},name),g.placed[bk].map(it=>h('span',{class:'placed'+(it.missed?' late':'')},it.text)))))));
  }
  load(set);
}

/* =========================================================
   TIMELINE
   ========================================================= */
function viewTimeline(){
  setNav('timeline');
  const st={rounds:0,perfect:0}; let g=null;
  const wrap=h('section',{class:'narrow'}); mount(wrap);
  function newRound(){ const used=new Set(), picks=[]; for(const e of shuffle(EVENTS)){ if(picks.length===5) break; if(used.has(e[0])) continue; used.add(e[0]); picks.push(e); } g={cards:shuffle(picks),picks:[],checked:false}; draw(); }
  function tap(e){
    if(g.checked) return;
    const at=g.picks.indexOf(e);
    if(at>=0){ if(at===g.picks.length-1){ g.picks.pop(); draw(); } return; }
    g.picks.push(e);
    if(g.picks.length===g.cards.length) check(); else draw();
  }
  function check(){
    g.checked=true; const sorted=[...g.cards].sort((a,b)=>a[0]-b[0]);
    g.sorted=sorted; g.good=sorted.map((e,i)=>g.picks[i]===e);
    const perfect=g.good.every(Boolean);
    st.rounds++; if(perfect) st.perfect++;
    draw();
    if(perfect) FX.cannon();
  }
  function draw(){
    let list;
    if(!g.checked){
      list=g.cards.map(e=>{ const at=g.picks.indexOf(e); return h('button',{class:'tl-card'+(at>=0?' picked':''),type:'button','data-key':'tl-'+e[0],onclick:()=>tap(e)},h('span',{class:'tl-n','aria-hidden':'true'},at>=0?String(at+1):''),h('span',{},e[1]),h('span',{class:'sr'},at>=0?'Position '+(at+1):'Not placed yet')); });
    } else {
      list=g.sorted.map((e,i)=>{ const yourPos=g.picks.indexOf(e)+1; return h('div',{class:'tl-card '+(g.good[i]?'good':'bad')},h('span',{class:'tl-n',title:'Your pick'},String(yourPos)),h('span',{},e[1],g.good[i]?null:h('span',{class:'muted small',style:'display:block'},'You put this at #'+yourPos+'. It belongs at #'+(i+1)+'.')),h('span',{class:'tl-year'},String(e[0]))); });
    }
    const n=g.checked?g.good.filter(Boolean).length:0;
    keepFocus(()=>wrap.replaceChildren(
      h('div',{class:'game-head',style:'margin-bottom:14px'},h('div',{},h('div',{class:'eyebrow'},'Timeline'),h('h2',{class:'game-title'},g.checked?'Correct order':'Click from earliest to latest')),
        h('div',{class:'qstats'},h('span',{class:'qstat'},'Rounds ',h('b',{},String(st.rounds))),h('span',{class:'qstat'},'Perfect ',h('b',{},String(st.perfect))))),
      g.checked?h('div',{class:'panel result-banner',style:'margin-bottom:14px'+(n===5?'':';border-color:var(--rule);background:var(--sheet)')},h('div',{},h('b',{},n===5?'All five in order':n+' of 5 in the right spot'),h('p',{class:'muted'},'Years are shown on the right.')),h('button',{class:'btn primary',type:'button','data-key':'tlnext',onclick:newRound},'Next round')):h('p',{class:'muted',style:'margin-bottom:14px'},'Click the earliest event first. Click your last pick again to undo it.'),
      h('div',{class:'tl-list'},list),
      !g.checked&&g.picks.length?h('div',{class:'row',style:'margin-top:14px'},h('button',{class:'btn ghost small',type:'button','data-key':'tlclear',onclick:()=>{ g.picks=[]; draw(); }},'Clear picks')):null));
  }
  newRound();
}

function viewGuide(opts){
  setNav('guide');
  let tab=opts.tab||'terms', query=opts.q||'', ch='all';
  const wrap=h('section',{}); mount(wrap);
  const listBox=h('div',{}), countEl=h('p',{class:'muted small',style:'margin-top:10px'}), chipBox=h('div',{class:'chips'});
  const search=h('input',{type:'search',id:'guide-search',class:'search',placeholder:'Search terms, people, cases…',value:query,'aria-label':'Search the study guide',autocomplete:'off'});
  search.addEventListener('input',()=>{ query=search.value; drawList(); });
  function entry(t){ return h('article',{class:'gentry'},h('div',{class:'gentry-top'},h('h4',{},t.n),h('span',{class:'tag'},CAT[t.cat])),h('p',{},t.d),h('p',{class:'gex'},h('b',{},'Remember: '),t.ex),h('button',{class:'btn small',type:'button',onclick:()=>quizTerm(t.k)},'Practice this term')); }
  function drawChips(){ keepFocus(()=>chipBox.replaceChildren(...CHOPTS.map(([v,l])=>chip(l,ch===v,()=>{ ch=v; drawChips(); drawList(); },'gch-'+v)))); }
  function drawList(){
    const qq=query.trim().toLowerCase();
    const items=TERMS.filter(t=>(ch==='all'||t.ch===+ch)&&(!qq||(t.n+' '+t.d+' '+t.ex).toLowerCase().includes(qq)));
    countEl.textContent='Showing '+items.length+' of '+TERMS.length+' terms';

    listBox.replaceChildren(...(groups.length?groups.map(([c,a])=>h('div',{class:'ggroup'},h('h3',{class:'ghead'},'Chapter '+c+' · '+CH[c]),h('div',{class:'gitems'},a.map(entry)))):[h('div',{class:'panel empty',style:'margin-top:18px'},'No terms match that search.')]));
  }
  function draw(){
    const tabs=h('div',{class:'tabs',role:'tablist'},
      h('button',{class:'tab',role:'tab',type:'button','aria-selected':String(tab==='terms'),onclick:()=>{ tab='terms'; draw(); }},'All '+TERMS.length+' terms'),
      h('button',{class:'tab',role:'tab',type:'button','aria-selected':String(tab==='charts'),onclick:()=>{ tab='charts'; draw(); }},'Comparison charts'));
    let pane;
    if(tab==='terms'){ pane=h('div',{style:'margin-top:18px'},h('div',{style:'display:grid;gap:12px'},search,chipBox),countEl,listBox); drawChips(); drawList(); }
    else {
      pane=h('div',{style:'margin-top:18px'},
        h('div',{class:'chips'},TABLES.map((T,i)=>h('button',{class:'tag jump',type:'button',onclick:()=>{ const el=document.getElementById('tbl-'+i); if(el) el.scrollIntoView({behavior:FX.reduce?'auto':'smooth',block:'start'}); }},T.t))),
        TABLES.map((T,i)=>h('section',{class:'tsec',id:'tbl-'+i},h('h3',{},T.t),h('p',{class:'note'},T.note),
          h('div',{class:'tablewrap'},h('table',{},h('thead',{},h('tr',{},T.head.map(x=>h('th',{scope:'col'},x)))),h('tbody',{},T.rows.map(r=>h('tr',{},h('th',{scope:'row'},r[0]),r.slice(1).map(c=>h('td',{},c))))))))));
    }
    wrap.replaceChildren(
      h('div',{class:'game-head'},h('div',{},h('div',{class:'eyebrow'},'Study guide'),h('h2',{class:'game-title'},'Everything on the review sheet')),h('button',{class:'btn primary',type:'button',onclick:()=>go('test')},'Test yourself')),
      h('div',{style:'margin-top:16px'},tabs),pane);
  }
  draw();
}
