<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="AP Gov Unit 1 review: practice tests, flashcards, and study games.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>AP Gov Unit 1 Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: a test answer sheet. Timing marks run down the edge of each sheet, and every answer choice gets a fill-in bubble. */
:root{
  --paper:#edf1f2; --sheet:#ffffff; --ink:#16222b; --muted:#56656e; --rule:#d0dce1;
  --form:#1b6a80; --form-strong:#114e60; --form-soft:#e1eef2;
  --graphite:#2b3036; --on-fill:#ffffff;
  --good:#1c7a45; --good-soft:#e2f2e8; --bad:#b4372b; --bad-soft:#f9e4e0;
  --display:"Libre Caslon Text","Iowan Old Style",Georgia,serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0f1519; --sheet:#161f25; --ink:#e3eaee; --muted:#98a7b0; --rule:#29373f;
  --form:#62b6cd; --form-strong:#95d0e2; --form-soft:#17313a;
  --graphite:#dce1e5; --on-fill:#0f1519;
  --good:#55c588; --good-soft:#143223; --bad:#f17f6d; --bad-soft:#3b1c17;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0f1519; --sheet:#161f25; --ink:#e3eaee; --muted:#98a7b0; --rule:#29373f;
  --form:#62b6cd; --form-strong:#95d0e2; --form-soft:#17313a;
  --graphite:#dce1e5; --on-fill:#0f1519;
  --good:#55c588; --good-soft:#143223; --bad:#f17f6d; --bad-soft:#3b1c17;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--form);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)} .small{font-size:14px}
p{margin:0}
h1,h2,h3,h4{margin:0;line-height:1.15;text-wrap:balance}

/* ---------- header ---------- */
.top{border-bottom:1px solid var(--rule);background:var(--paper)}
.top-in{max-width:1060px;margin:0 auto;padding-inline:clamp(16px,4vw,32px);padding-block:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.seal{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--form);display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:600;color:var(--form);flex:none}
.brand-name{display:block;font-family:var(--display);font-weight:700;font-size:18px;line-height:1.15}
.brand-sub{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* ---------- page ---------- */
.wrap{max-width:1060px;margin:0 auto;padding-inline:clamp(16px,4vw,32px);padding-block:28px 80px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--form)}
.section-title{font-family:var(--display);font-size:26px;margin:44px 0 16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:clamp(18px,3vw,26px)}
.sheet{position:relative;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:clamp(20px,3vw,30px);padding-left:clamp(38px,4.4vw,52px)}
.sheet::before,.face::before{content:"";position:absolute;left:clamp(13px,1.6vw,18px);top:22px;bottom:22px;width:9px;background:repeating-linear-gradient(to bottom,var(--ink) 0 5px,transparent 5px 17px);opacity:.8}
.tag{display:inline-flex;align-items:center;font-family:var(--mono);font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--rule);color:var(--muted);background:var(--sheet)}
.ph{font-family:var(--display);font-size:20px;margin-bottom:14px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);font-weight:600;font-size:15px;cursor:pointer;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--form)}
.btn.primary{background:var(--form);border-color:var(--form);color:var(--on-fill)}
.btn.primary:hover{background:var(--form-strong);border-color:var(--form-strong)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--form)}
.btn.ghost:hover{background:var(--form-soft)}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px}
.btn.big{min-height:50px;padding:12px 24px;font-size:16px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- toggle chips (fill-in bubbles) ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips.center{justify-content:center}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:6px 14px 6px 10px;border-radius:999px;border:1px solid var(--rule);background:var(--sheet);font-size:14px;font-weight:500;cursor:pointer}
.chip::before{content:"";width:14px;height:14px;border-radius:50%;border:1.5px solid var(--form);flex:none}
.chip:hover{border-color:var(--form)}
.chip[aria-pressed="true"]{border-color:var(--form);background:var(--form-soft)}
.chip[aria-pressed="true"]::before{background:var(--graphite);border-color:var(--graphite)}

/* ---------- home ---------- */
.hero{display:grid;gap:28px}
@media (min-width:860px){.hero{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);align-items:start}}
.hero h1{font-family:var(--display);font-size:clamp(32px,5vw,48px);line-height:1.08;margin:10px 0 14px;letter-spacing:-.01em}
.lede{font-size:18px;color:var(--muted);max-width:56ch;margin-bottom:22px}
.side{display:grid;gap:18px;border-top:1px solid var(--rule);padding-top:20px}
@media (min-width:860px){.side{border-top:0;border-left:1px solid var(--rule);padding-top:0;padding-left:28px}}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 12px}
.stat{display:grid;gap:2px;min-width:0}
.stat .num{font-family:var(--mono);font-size:24px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.meters{display:grid;gap:12px}
.mtop{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:6px}
.mtop b{font-weight:600}
.mtop span{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.meter{height:8px;border-radius:999px;background:var(--form-soft);overflow:hidden}
.meter>span{display:block;height:100%;background:var(--form);border-radius:inherit}
.modes{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:540px){.modes{grid-template-columns:repeat(2,1fr)}}
@media (min-width:980px){.modes{grid-template-columns:repeat(4,1fr)}}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;padding:18px;border:1px solid var(--rule);border-radius:var(--r);background:var(--sheet);cursor:pointer;transition:border-color .15s,transform .15s}
.mode:hover{border-color:var(--form);transform:translateY(-2px)}
.mode.feature{background:var(--form-soft);border-color:var(--form)}
.mode h3{font-family:var(--display);font-size:20px}
.mode p{color:var(--muted);font-size:15px}
.mmeta{margin-top:auto;font-family:var(--mono);font-size:12px;color:var(--form-strong)}
.mini-bubbles{display:flex;gap:5px}
.mini-bubbles .bubble{width:22px;height:22px;font-size:10px}
.mini-bubbles .bubble.on{background:var(--graphite);border-color:var(--graphite);color:var(--on-fill)}
.guide-banner{margin-top:14px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.guide-banner h3{font-family:var(--display);font-size:20px;margin-bottom:4px}
.weak{display:grid;gap:8px}
.weak-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 14px;border:1px solid var(--rule);border-radius:10px;background:var(--sheet)}
.weak-row b{font-weight:600;min-width:0}
.weak-row .pct{font-family:var(--mono);font-size:14px;color:var(--bad)}
.footer-row{margin-top:36px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:14px}

/* ---------- setup ---------- */
.narrow{max-width:820px;margin:0 auto}
.setup{display:grid;gap:22px}
.big-title{font-family:var(--display);font-size:clamp(26px,4vw,36px);margin-top:6px}
.field{display:grid;gap:10px}
.field-label{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.setup-foot{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;border-top:1px solid var(--rule);padding-top:18px}
.center-panel{text-align:center;display:grid;gap:14px;justify-items:center}
.best-line{font-family:var(--mono);font-size:15px;color:var(--muted)}

/* ---------- quiz ---------- */
.quiz{display:grid;gap:14px;max-width:820px;margin:0 auto;scroll-margin-top:16px}
.quiz-head{display:grid;gap:10px}
.quiz-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;align-items:center}
.qstats{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.qstat{font-family:var(--mono);font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.qstat b{color:var(--ink);font-weight:600}
.progress{height:6px;background:var(--form-soft);border-radius:999px;overflow:hidden}
.progress>span{display:block;height:100%;background:var(--form);transition:width .3s}
.lives{display:inline-flex;gap:5px;align-items:center}
.life{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--bad)}
.life.on{background:var(--bad)}
.qtags{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.qnum{font-family:var(--mono);font-weight:600;font-size:13px;min-width:30px;height:30px;padding:0 8px;border-radius:999px;background:var(--ink);color:var(--sheet);display:inline-grid;place-items:center}
.qtext{font-family:var(--body);font-weight:600;font-size:clamp(18px,2.3vw,21px);line-height:1.42}
.qquote{margin:14px 0 0;padding:12px 16px;border-left:3px solid var(--form);background:var(--form-soft);border-radius:0 8px 8px 0;font-family:var(--display);font-size:17px;line-height:1.55}
.choices{display:grid;gap:10px;margin-top:20px}
.choice{display:grid;grid-template-columns:32px minmax(0,1fr);gap:14px;align-items:start;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--rule);border-radius:10px;background:var(--sheet);color:var(--ink);font-size:16px;line-height:1.45;cursor:pointer;transition:border-color .15s,background .15s,opacity .2s}
.choice:hover:not(:disabled){border-color:var(--form);background:var(--form-soft)}
.choice:disabled{cursor:default;color:var(--ink)}
.bubble{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--form);display:grid;place-items:center;font-family:var(--mono);font-size:13px;font-weight:600;color:var(--form);flex:none}
.ctext{padding-top:3px;min-width:0}
.choice.picked{border-color:var(--graphite)}
.choice.picked .bubble{background:var(--graphite);border-color:var(--graphite);color:var(--on-fill)}
.choice.right{border-color:var(--good);background:var(--good-soft)}
.choice.right .bubble{background:var(--good);border-color:var(--good);color:var(--on-fill)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s}
.choice.wrong .bubble{background:var(--bad);border-color:var(--bad);color:var(--on-fill)}
.choice.dim{opacity:.55}
.feedback{margin-top:16px;padding:14px 16px;border-radius:10px;border:1px solid var(--rule);display:grid;gap:6px}
.feedback.ok{border-color:var(--good);background:var(--good-soft)}
.feedback.no{border-color:var(--bad);background:var(--bad-soft)}
.fb-title{font-weight:700;font-size:17px}
.feedback.ok .fb-title{color:var(--good)} .feedback.no .fb-title{color:var(--bad)}
.keyterm{color:var(--muted);font-size:15px}
.keyterm b{color:var(--ink);font-weight:600}
.qactions{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:18px}
.quiz-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:13px}
@media (hover:none){.hint{display:none}}

/* ---------- results ---------- */
.results{display:grid;gap:16px;max-width:820px;margin:0 auto}
.res-head{display:grid;gap:8px}
.score-big{font-family:var(--display);font-weight:700;font-size:clamp(48px,8vw,72px);line-height:1}
.res-title{font-family:var(--display);font-size:24px}
.res-sub{font-family:var(--mono);font-size:15px;color:var(--muted)}
.review{display:grid;gap:14px}
.review-item{border-top:1px solid var(--rule);padding-top:14px;display:grid;gap:8px}
.review-item:first-child{border-top:0;padding-top:0}
.review-item h4{font-size:16px;font-weight:600;line-height:1.45}
.ans{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:start;font-size:15px}
.ans .dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:11px;color:var(--on-fill)}
.ans.bad .dot{background:var(--bad)} .ans.good .dot{background:var(--good)}
.x{color:var(--muted);font-size:15px}

/* ---------- flashcards ---------- */
.cards{display:grid;gap:16px;max-width:780px;margin:0 auto}
.flash{perspective:1400px;border:0;background:none;padding:0;cursor:pointer;text-align:left;display:block;width:100%}
.flash-inner{display:grid;transition:transform .5s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.flash.flipped .flash-inner{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;min-height:290px;position:relative;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:26px 26px 22px clamp(40px,5vw,56px);display:flex;flex-direction:column;justify-content:center;gap:12px}
.face.back{transform:rotateY(180deg)}
.term-big{font-family:var(--display);font-size:clamp(26px,4.4vw,38px);line-height:1.12}
.def-big{font-size:clamp(17px,2.2vw,20px);line-height:1.55}
.face .ex{color:var(--muted);font-size:15px}
.flip-hint{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:auto}
.card-nav{display:flex;justify-content:space-between;align-items:center;gap:12px}
.card-count{font-family:var(--mono);font-size:14px;color:var(--muted)}
.sortbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tally{display:flex;gap:6px 16px;flex-wrap:wrap}

/* ---------- match ---------- */
.game{display:grid;gap:16px;max-width:960px;margin:0 auto}
.game-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.game-title{font-family:var(--display);font-size:clamp(22px,3.2vw,28px);margin-top:4px}
.match-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.mcol{display:grid;gap:8px;align-content:start}
.mcol-h{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tile{min-height:62px;padding:10px 12px;border:1px solid var(--rule);border-radius:10px;background:var(--sheet);font-size:15px;line-height:1.35;text-align:left;cursor:pointer}
.tile.term{font-family:var(--display);font-weight:700}
.tile:hover:not(:disabled){border-color:var(--form)}
.tile.sel{border-color:var(--form);background:var(--form-soft);box-shadow:inset 0 0 0 1px var(--form)}
.tile.matched{border-color:var(--good);background:var(--good-soft);color:var(--good);cursor:default}
.tile.miss{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s}
.result-banner{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;border-color:var(--good);background:var(--good-soft)}
.result-banner b{font-family:var(--display);font-size:20px}
@media (max-width:520px){.tile{font-size:13.5px;padding:8px 10px}}

/* ---------- lightning ---------- */
.tbar{height:10px;border-radius:999px;background:var(--form-soft);overflow:hidden}
.tbar>span{display:block;height:100%;background:var(--form)}
.lgrid{display:grid;gap:10px;margin-top:18px}
@media (min-width:700px){.lgrid{grid-template-columns:1fr 1fr}}
.lprompt{font-family:var(--display);font-size:clamp(24px,3.6vw,32px);margin-top:6px}
.lquote{font-family:var(--display);font-size:clamp(18px,2.4vw,21px);line-height:1.5;margin-top:6px}
.tleft{font-family:var(--mono);font-size:18px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}

/* ---------- sort ---------- */
.tray{display:flex;flex-wrap:wrap;gap:8px;padding:14px;border:1.5px dashed var(--rule);border-radius:var(--r);min-height:64px}
.item{padding:8px 12px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet);font-size:15px;cursor:grab;text-align:left;line-height:1.3}
.item:hover{border-color:var(--form)}
.item.sel{border-color:var(--form);background:var(--form-soft);box-shadow:inset 0 0 0 1px var(--form)}
.item.missed{border-style:dashed}
.shake{animation:shake .35s}
.select-hint{min-height:24px;font-size:15px;color:var(--form-strong);font-weight:500}
.buckets{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.bucket{display:flex;flex-direction:column;gap:6px;text-align:left;padding:12px;min-height:140px;border-radius:var(--r);border:1.5px solid var(--rule);background:var(--sheet);cursor:pointer}
.bucket h4{font-family:var(--display);font-size:16px}
.bucket.armed{border-color:var(--form)}
.bucket.over{background:var(--form-soft)}
.placed{font-size:13.5px;padding:5px 9px;border-radius:6px;background:var(--good-soft);border:1px solid var(--good);line-height:1.3}
.placed.late{border-style:dashed}

/* ---------- timeline ---------- */
.tl-list{display:grid;gap:10px}
.tl-card{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--rule);border-radius:10px;background:var(--sheet);font-size:16px;cursor:pointer}
button.tl-card:hover{border-color:var(--form)}
.tl-card .tl-n{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--form);display:grid;place-items:center;font-family:var(--mono);font-size:13px;font-weight:600;color:var(--form)}
.tl-card.picked .tl-n{background:var(--graphite);border-color:var(--graphite);color:var(--on-fill)}
.tl-card.good{border-color:var(--good);background:var(--good-soft);cursor:default}
.tl-card.good .tl-n{background:var(--good);border-color:var(--good);color:var(--on-fill)}
.tl-card.bad{border-color:var(--bad);background:var(--bad-soft);cursor:default}
.tl-card.bad .tl-n{background:var(--bad);border-color:var(--bad);color:var(--on-fill)}
.tl-year{font-family:var(--mono);font-size:16px;font-weight:600}

/* ---------- study guide ---------- */
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{min-height:40px;padding:8px 16px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet);font-weight:600;font-size:15px;cursor:pointer;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.search{width:100%;min-height:46px;padding:10px 14px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);font:inherit}
.search:focus{outline:2px solid var(--form);outline-offset:1px}
.ggroup{display:grid;gap:12px;margin-top:24px}
.ghead{font-family:var(--display);font-size:22px}
.gitems{display:grid;gap:12px}
@media (min-width:800px){.gitems{grid-template-columns:1fr 1fr}}
.gentry{padding:16px 18px;border:1px solid var(--rule);border-radius:var(--r);background:var(--sheet);display:grid;gap:8px;align-content:start;min-width:0}
.gentry-top{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;justify-content:space-between}
.gentry h4{font-family:var(--display);font-size:18px}
.gentry p{font-size:15px}
.gex{color:var(--muted)} .gex b{color:var(--form-strong);font-weight:600}
.gentry .btn{justify-self:start}
.jump{cursor:pointer;min-height:34px}
.jump:hover{border-color:var(--form);color:var(--ink)}
.tsec{display:grid;gap:8px;margin-top:28px;scroll-margin-top:16px}
.tsec h3{font-family:var(--display);font-size:21px}
.note{color:var(--muted);font-size:15px}
.tablewrap{overflow-x:auto;border:1px solid var(--rule);border-radius:var(--r);background:var(--sheet)}
table{border-collapse:collapse;width:100%;min-width:600px;font-size:15px}
th,td{padding:10px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--rule)}
tr:last-child th,tr:last-child td{border-bottom:0}
thead th{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--form-strong);background:var(--form-soft)}
tbody th{font-family:var(--display);font-weight:700}
.empty{text-align:center;color:var(--muted)}

/* ---------- overlays ---------- */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 16px);z-index:60;display:grid;gap:8px;width:min(380px,calc(100% - 32px));pointer-events:none}
.toast{background:var(--sheet);border:1px solid var(--form);border-radius:10px;padding:10px 14px;box-shadow:0 10px 30px -12px rgba(0,0,0,.35);display:grid;gap:2px;animation:rise .3s ease-out}
.toast b{font-weight:700}
.toast span{color:var(--muted);font-size:14px}
.toast.out{opacity:0;transition:opacity .3s}
.floater{position:fixed;transform:translate(-50%,-50%);font-family:var(--mono);font-weight:600;font-size:18px;color:var(--bad);pointer-events:none;z-index:55;animation:floatUp 1s ease-out forwards}
.enter{animation:rise .25s ease-out}

@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-30%)}20%{opacity:1;transform:translate(-50%,-70%)}100%{opacity:0;transform:translate(-50%,-180%)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
